<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#43805d"><title>Yoga Companion Library</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#edf6ef;color:#234b35}*{box-sizing:border-box}body{margin:0}header{background:#e0f0e4;padding:18px max(18px,calc((100vw - 860px)/2));border-bottom:1px solid #c7e1cd}h1{margin:0;font-size:26px}h2{font-size:19px;margin:10px 0}p{line-height:1.5}.muted{color:#597567;font-size:14px}.wrap{max-width:860px;margin:auto;padding:18px}.card{background:white;border:1px solid #cfe3d3;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #153b2010}input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #9cbea6}button{cursor:pointer;background:#e7f4ea;color:#205338}button.primary{background:#337950;color:white}button:focus-visible,input:focus-visible{outline:3px solid #91c6a1}input[type=search]{width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.class{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:8px;min-height:130px}.class strong{font-size:18px}.class small{color:#53745f}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar>*{flex:1;min-width:140px}.hide{display:none!important}iframe{border:0;width:100%;height:85vh;min-height:650px;background:#eaf5ec;border-radius:12px}#notice{white-space:pre-line}#playerArea{margin-top:8px}@media(max-width:650px){.wrap{padding:10px}iframe{height:calc(100dvh - 130px);min-height:550px}header{padding:14px}}
</style></head><body><header><h1>🌿 Yoga Companion</h1><div class="muted">Your yoga class library · guided sessions, music and spoken pose changes</div></header><main class="wrap"><section id="catalogue"><div class="card"><h2>Choose a yoga class</h2><div class="bar"><input id="search" type="search" placeholder="Search classes or categories" aria-label="Search classes"><select id="category" aria-label="Filter category"><option value="">All categories</option></select></div><p class="muted">Choose a class to begin. Your instructor can publish new classes to this same page.</p><div class="bar"><button id="refresh">↻ Refresh published classes</button><button id="import">＋ Open a class JSON file</button><input id="file" type="file" accept=".json,application/json" multiple hidden></div><p class="muted" id="notice" role="status"></p></div><div id="cards" class="grid"></div></section><section id="playerArea" class="hide"><div class="bar"><button id="back">← All classes</button><strong id="selectedTitle"></strong></div><iframe id="player" title="Yoga class guided player" allow="autoplay"></iframe></section></main><script id="playerTemplate" type="application/json">"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#8ab99a\">\u003ctitle>Yoga Companion\u003c/title>\u003cstyle>\n:root{font-family:system-ui,sans-serif;color:#254636;background:#eaf5ec}*{box-sizing:border-box}body{max-width:650px;margin:auto;padding:12px}h1{font-size:23px;margin:7px 0}.card{background:white;border:1px solid #cce3d2;border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #163e1b0a}button,input,select{font:inherit}button{border:1px solid #87b697;background:#f3faf5;color:#1d5635;border-radius:10px;padding:10px 13px;cursor:pointer}button.primary{background:#367b52;color:white}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.clock{font-size:54px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums}.sub{font-size:13px;color:#547361}.pose{font-size:23px;text-align:center;font-weight:700}.image{width:100%;max-height:240px;object-fit:contain;background:#f0f8f1;border-radius:10px}.line{display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #e2efe5;cursor:pointer}.line span{flex:1}.active{background:#e5f6e9;border-radius:7px}details{margin-top:10px}summary{cursor:pointer;font-weight:650}a{color:#17663e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}label{font-size:13px;display:block;margin:7px 0}select,input[type=file]{width:100%;padding:8px;border:1px solid #b9d8c3;border-radius:8px}progress{width:100%;height:12px;accent-color:#398258}.small{font-size:12px}#songName{overflow-wrap:anywhere}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ch1>🌿 Yoga Companion\u003c/h1>\u003cdiv id=\"classTitle\" class=\"sub\">\u003c/div>\u003c/header>\u003csection class=\"card\">\u003cimg id=\"poseImage\" class=\"image\" alt=\"Yoga pose illustration\" hidden>\u003cdiv class=\"pose\" id=\"poseName\">\u003c/div>\u003cdiv class=\"sub\" id=\"sanskrit\" style=\"text-align:center\">\u003c/div>\u003cdiv class=\"clock\" id=\"clock\">00:00\u003c/div>\u003cdiv class=\"sub\" id=\"next\" style=\"text-align:center\">\u003c/div>\u003cprogress id=\"progress\" value=\"0\" max=\"1\">\u003c/progress>\u003cdiv class=\"controls\">\u003cbutton id=\"previous\">◀ Previous\u003c/button>\u003cbutton class=\"primary\" id=\"play\">▶ Start\u003c/button>\u003cbutton id=\"forward\">Next ▶\u003c/button>\u003c/div>\u003cdiv class=\"controls\">\u003cbutton id=\"restart\">Restart\u003c/button>\u003clabel>\u003cinput type=\"checkbox\" id=\"voice\" checked> Speak next pose\u003c/label>\u003c/div>\u003cdetails open>\u003csummary>Pose instructions & modifications\u003c/summary>\u003cp id=\"instructions\">\u003c/p>\u003cp id=\"modification\" class=\"sub\">\u003c/p>\u003ca id=\"demo\" target=\"_blank\" rel=\"noopener noreferrer\">Video demonstration search\u003c/a>\u003c/details>\u003c/section>\n\u003csection class=\"card\">\u003ch2>Background sounds & music\u003c/h2>\u003cdiv class=\"grid\">\u003cdiv>\u003clabel for=\"ambient\">Relaxing sounds\u003c/label>\u003cselect id=\"ambient\">\u003coption value=\"off\">Off\u003c/option>\u003coption value=\"rain\">Gentle rain\u003c/option>\u003coption value=\"ocean\">Ocean waves\u003c/option>\u003coption value=\"wind\">Soft breeze\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel for=\"volume\">Volume\u003c/label>\u003cinput id=\"volume\" type=\"range\" min=\"0\" max=\"100\" value=\"35\">\u003c/div>\u003c/div>\u003clabel>Choose your own music (multiple tracks)\u003c/label>\u003cinput id=\"files\" type=\"file\" accept=\"audio/*\" multiple>\u003cdiv class=\"controls\">\u003cbutton id=\"musicPlay\">Play music\u003c/button>\u003cbutton id=\"musicPause\">Pause music\u003c/button>\u003clabel>\u003cinput id=\"loop\" type=\"checkbox\" checked> Repeat playlist\u003c/label>\u003clabel>\u003cinput id=\"shuffle\" type=\"checkbox\"> Shuffle\u003c/label>\u003c/div>\u003cdiv class=\"sub\" id=\"songName\">No music selected\u003c/div>\u003cp class=\"small sub\">Audio starts after you interact with the page. Device music is selected locally and is not included in the shared file.\u003c/p>\u003c/section>\n\u003csection class=\"card\">\u003ch2>Full class\u003c/h2>\u003cdiv class=\"sub\" id=\"total\">\u003c/div>\u003cdiv id=\"list\">\u003c/div>\u003c/section>\n\u003cscript id=\"classData\" type=\"application/json\">__CLASS_DATA__\u003c/script>\u003cscript>\n(()=>{'use strict';const $=id=>document.getElementById(id),data=JSON.parse($('classData').textContent);const poses=Array.isArray(data.poses)?data.poses:[];let index=0,remaining=0,running=false,last=0,spoken=false,raf=0,files=[],order=[],track=0,audio=new Audio(),ambientCtx=null,noise=null,source=null,gain=null,osc=null,oscGain=null,ambientMode='off';\nconst safe=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));const fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};const duration=p=>Math.max(5,Number(p.seconds)||60);const storage='yoga-companion-progress-'+(data.id||'class');\nfunction save(){try{localStorage.setItem(storage,JSON.stringify({index,remaining}))}catch(e){}}\nfunction speak(s){if(!$('voice').checked||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.rate=.85;u.volume=.95;speechSynthesis.speak(u)}catch(e){}}\nfunction draw(){if(!poses.length){$('poseName').textContent='No poses in this class';return}const p=poses[index];$('poseName').textContent=p.name;$('sanskrit').textContent=p.sanskrit||'';$('clock').textContent=fmt(remaining);$('next').textContent=index+1\u003cposes.length?'Next: '+poses[index+1].name:'Final pose';$('progress').max=poses.length;$('progress').value=index+(1-remaining/duration(p));$('instructions').textContent=p.desc||'Move slowly and breathe comfortably.';$('modification').textContent=p.modification||'Adjust the range or use a prop for support as needed.';$('demo').href=p.url||'https://www.youtube.com/results?search_query='+encodeURIComponent(p.name+' yoga demonstration');const img=$('poseImage');if(p.pic){img.src=p.pic;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')};$('play').textContent=running?'⏸ Pause':'▶ Start';document.querySelectorAll('[data-index]').forEach(el=>el.classList.toggle('active',+el.dataset.index===index));save()}\nfunction go(i){if(!poses.length)return;index=Math.max(0,Math.min(poses.length-1,i));remaining=duration(poses[index]);spoken=false;last=performance.now();draw()}\nfunction tick(now){if(running&&poses.length){const dt=Math.min(2,(now-last)/1000);last=now;remaining=Math.max(0,remaining-dt);if(!spoken&&remaining\u003c=3&&index+1\u003cposes.length){spoken=true;speak('Next, '+poses[index+1].name)}if(remaining\u003c=0){if(index+1\u003cposes.length){go(index+1)}else{running=false;speak('Your yoga class is complete. Namaste.')}}draw()}raf=requestAnimationFrame(tick)}\nfunction start(){if(!poses.length)return;running=!running;last=performance.now();if(running){try{ambientCtx?.resume()}catch(e){}}draw()}\n$('classTitle').textContent=data.title+' · '+poses.length+' poses';$('total').textContent=poses.length+' timed steps · '+fmt(poses.reduce((a,p)=>a+duration(p),0))+' total';$('list').innerHTML=poses.map((p,i)=>'\u003cdiv class=\"line\" data-index=\"'+i+'\" tabindex=\"0\" role=\"button\">\u003cb>'+(i+1)+'.\u003c/b>\u003cspan>'+safe(p.name)+(p.sanskrit?'\u003csmall class=\"sub\"> · '+safe(p.sanskrit)+'\u003c/small>':'')+'\u003c/span>\u003csmall>'+fmt(duration(p))+'\u003c/small>\u003c/div>').join('');$('list').onclick=e=>{const el=e.target.closest('[data-index]');if(el)go(+el.dataset.index)};$('list').onkeydown=e=>{if(e.key==='Enter'){const el=e.target.closest('[data-index]');if(el)go(+el.dataset.index)}};$('play').onclick=start;$('previous').onclick=()=>go(index-1);$('forward').onclick=()=>go(index+1);$('restart').onclick=()=>{running=false;go(0)};\nfunction stopAmbient(){if(source){try{source.stop()}catch(e){}source.disconnect();source=null}if(osc){try{osc.stop()}catch(e){}osc.disconnect();osc=null}if(gain){gain.disconnect();gain=null}if(oscGain){oscGain.disconnect();oscGain=null}}\nfunction ambient(){stopAmbient();ambientMode=$('ambient').value;if(ambientMode==='off')return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!ambientCtx)ambientCtx=new C();ambientCtx.resume();const sr=ambientCtx.sampleRate,buffer=ambientCtx.createBuffer(1,sr*3,sr),a=buffer.getChannelData(0);let prev=0;for(let i=0;i\u003ca.length;i++){const w=Math.random()*2-1;prev=(prev*.985)+(w*.015);a[i]=ambientMode==='rain'?w*.27+prev*.6:prev*3}source=ambientCtx.createBufferSource();source.buffer=buffer;source.loop=true;gain=ambientCtx.createGain();gain.gain.value=(+$('volume').value/100)*.13;source.connect(gain).connect(ambientCtx.destination);source.start();if(ambientMode==='ocean'){osc=ambientCtx.createOscillator();osc.frequency.value=.12;oscGain=ambientCtx.createGain();oscGain.gain.value=.035;osc.connect(oscGain).connect(gain.gain);osc.start()}}\n$('ambient').onchange=ambient;$('volume').oninput=()=>{if(gain)gain.gain.value=(+$('volume').value/100)*.13;audio.volume=+$('volume').value/100};audio.volume=.35;\nfunction arrange(){order=files.map((_,i)=>i);if($('shuffle').checked)order.sort(()=>Math.random()-.5);track=0}\nfunction playTrack(){if(!files.length)return;if(track>=order.length){if(!$('loop').checked){$('songName').textContent='Playlist finished';return}arrange()}const f=files[order[track]];if(audio.src?.startsWith('blob:'))URL.revokeObjectURL(audio.src);audio.src=URL.createObjectURL(f);$('songName').textContent=(track+1)+' / '+order.length+' · '+f.name;audio.play().catch(()=>{$('songName').textContent='Tap Play music to allow audio'})}\naudio.onended=()=>{track++;playTrack()};$('files').onchange=e=>{files=Array.from(e.target.files||[]);arrange();$('songName').textContent=files.length+' tracks selected';audio.pause()};$('musicPlay').onclick=()=>{if(!files.length){$('songName').textContent='Choose music files first';return}if(!audio.src||audio.ended)playTrack();else audio.play().catch(()=>{})};$('musicPause').onclick=()=>audio.pause();$('shuffle').onchange=arrange;\ntry{const p=JSON.parse(localStorage.getItem(storage)||'null');if(p&&p.index>=0&&p.index\u003cposes.length){index=p.index;remaining=Math.max(0,Math.min(duration(poses[index]),Number(p.remaining)||duration(poses[index])))}else remaining=poses.length?duration(poses[0]):0}catch(e){remaining=poses.length?duration(poses[0]):0}draw();raf=requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;draw()}});\n})();\n\u003c/script>\u003c/body>\u003c/html>"</script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),playerTemplate=JSON.parse($('playerTemplate').textContent);let classes=[],catalogue=[],current=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9-]/g,'-');
function valid(x){return x&&typeof x==='object'&&typeof x.title==='string'&&Array.isArray(x.poses)&&x.poses.length>0&&x.poses.length<1500}
function total(c){return Math.round(c.poses.reduce((a,p)=>a+Math.max(0,Number(p.seconds)||0),0)/60)}
function add(x){if(!valid(x))throw Error('Class must have a title and a nonempty poses array');const c={...x,id:String(x.id||slug(x.title)),category:String(x.category||'Yoga')};const i=classes.findIndex(v=>v.id===c.id);if(i>=0)classes[i]=c;else classes.push(c);return c}
function render(){const query=$('search').value.toLowerCase().trim(),cat=$('category').value;const cats=[...new Set(classes.map(c=>c.category||'Yoga'))].sort();$('category').innerHTML='<option value="">All categories</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');$('category').value=cats.includes(cat)?cat:'';const items=classes.filter(c=>(!$('category').value||c.category===$('category').value)&&(!query||(c.title+' '+c.category+' '+(c.description||'')).toLowerCase().includes(query)));$('cards').replaceChildren();for(const c of items){const b=document.createElement('button');b.className='card class';const strong=document.createElement('strong');strong.textContent=c.title;const desc=document.createElement('span');desc.textContent=c.description||'Guided yoga class with individual pose timings';const meta=document.createElement('small');meta.textContent=(c.category||'Yoga')+' · '+total(c)+' min · '+c.poses.length+' poses';b.append(strong,desc,meta);b.onclick=()=>openClass(c);$('cards').append(b)}if(!items.length){const p=document.createElement('p');p.className='card muted';p.textContent=classes.length?'No classes match these filters.':'No classes published yet. Add class JSON files and update classes/manifest.json.';$('cards').append(p)}}
function openClass(c){current=c;$('selectedTitle').textContent=c.title;const json=JSON.stringify(c).replace(/</g,'\u003c');$('player').srcdoc=playerTemplate.replace('__CLASS_DATA__',json);$('catalogue').classList.add('hide');$('playerArea').classList.remove('hide');window.scrollTo(0,0)}
$('back').onclick=()=>{$('player').srcdoc='';$('playerArea').classList.add('hide');$('catalogue').classList.remove('hide');current=null};
$('search').oninput=render;$('category').onchange=render;$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let ok=0;for(const f of e.target.files){try{add(JSON.parse(await f.text()));ok++}catch(err){$('notice').textContent='Could not open '+f.name+': '+err.message}}if(ok)$('notice').textContent=ok+' class file(s) opened on this device. To publish for everyone, upload the JSON to GitHub and add it to classes/manifest.json.';render();e.target.value=''};
async function loadPublished(){try{const response=await fetch('classes/manifest.json',{cache:'no-store'});if(!response.ok)throw Error('manifest.json not found');const m=await response.json();if(!Array.isArray(m.classes))throw Error('manifest must contain a classes array');const results=await Promise.allSettled(m.classes.map(async entry=>{const file=typeof entry==='string'?entry:entry.file;if(typeof file!=='string'||!/^[-a-zA-Z0-9_./]+\.json$/.test(file)||file.includes('..')||file.startsWith('/'))throw Error('Invalid class file path');const r=await fetch('classes/'+file,{cache:'no-store'});if(!r.ok)throw Error(file+': HTTP '+r.status);const x=await r.json();if(entry&&typeof entry==='object'){if(entry.category)x.category=entry.category;if(entry.description)x.description=entry.description}return add(x)}));catalogue=results.filter(x=>x.status==='fulfilled').map(x=>x.value);const fails=results.filter(x=>x.status==='rejected');$('notice').textContent=catalogue.length+' published class(es) loaded'+(fails.length?'; '+fails.length+' class file(s) failed to load.':'')+'.';render()}catch(err){$('notice').textContent='Published classes are unavailable ('+err.message+'). If you opened this as a local HTML file, use GitHub Pages or Open a class JSON file.';render()}}
$('refresh').onclick=()=>{classes=[];loadPublished()};render();loadPublished();
})();
</script></body></html>
